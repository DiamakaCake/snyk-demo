<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive demo sample: from 202 vulnerabilities to a fix pull request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--burgundy:#7a1f3d;--burgundy-d:#5c1730;--pink:#f3c9d5;--pink-l:#fbeef2;--ink:#2b2226;--muted:#6f6166;--line:#ecd9df}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--pink-l);min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
.wrap{width:100%;max-width:1080px}
h1,h2{font-family:Poppins,Inter,sans-serif;color:var(--burgundy);margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:12px;background:#fff}
.mid{display:flex;flex-direction:column;align-items:center;gap:7px}
.step-label{font-weight:600;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dot{width:24px;height:5px;border-radius:3px;background:var(--line);transition:background .2s}
.dot.on{background:var(--burgundy)}.dot.done{background:var(--pink)}
.stage{position:relative;background:#f7f7f9;line-height:0}
.shot{position:relative}
.stage img{width:100%;height:auto;display:block}
.hot{position:absolute;border:3px solid var(--burgundy);border-radius:8px;background:rgba(243,201,213,.35);cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.hot:focus-visible{outline:3px solid #000;outline-offset:2px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(122,31,61,.45)}50%{box-shadow:0 0 0 9px rgba(122,31,61,0)}}
@media (prefers-reduced-motion:reduce){.hot{animation:none}}
.caption{padding:18px 22px 22px;line-height:1.5}
.caption h2{font-size:20px;margin-bottom:6px}
.caption p{margin:0;font-size:15.5px}
.hint{display:block;margin-top:8px;font-size:13px;color:var(--burgundy);font-weight:500}
@media (max-width:560px){.dot{width:14px}.step-label{font-size:12px}button{padding:9px 14px}.caption{padding:16px 16px 18px}}
.tip{margin-top:16px;font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;font-size:14px;border-radius:999px;padding:10px 20px;cursor:pointer;border:1px solid var(--burgundy)}
.primary{background:var(--burgundy);color:#fff}.primary:hover{background:var(--burgundy-d)}
.ghost{background:#fff;color:var(--burgundy)}.ghost:hover{background:var(--pink-l)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid #000;outline-offset:2px}
.screen{padding:56px 28px;text-align:center}
.screen h1{font-size:clamp(26px,5vw,42px);line-height:1.2;max-width:760px;margin:0 auto 14px}
.screen p{max-width:560px;margin:0 auto 26px;font-size:17px;line-height:1.55;color:var(--muted)}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--burgundy);margin-bottom:14px}
.note{margin:14px 4px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.hidden{display:none}

.pop{position:absolute;background:var(--burgundy);color:#fff;border-radius:12px;padding:14px 16px 14px;line-height:1.45;box-shadow:0 8px 24px rgba(60,10,30,.35);z-index:3;min-width:240px}
.pop-step{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);font-weight:600;margin-bottom:4px}
.pop h2{color:#fff;font-size:16.5px;line-height:1.3;margin:0 0 6px}
.pop p{margin:0;font-size:13.5px;color:#fff}
.pop-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.pop .hint{margin:0;color:var(--pink);font-size:12px}
.pop button{background:#fff;color:var(--burgundy);border:0;padding:6px 12px;font-size:12.5px}
.pop::after{content:"";position:absolute;border:9px solid transparent}
.pop-up::after{top:-17px;left:28px;border-bottom-color:var(--burgundy)}
.pop-down::after{bottom:-17px;left:28px;border-top-color:var(--burgundy)}
.pop-left::after{left:-17px;top:18px;border-right-color:var(--burgundy)}
@media (max-width:700px){.pop{position:static;border-radius:0;width:auto!important;box-shadow:none;padding:16px}.pop::after{display:none}.pop h2{font-size:17px}.pop p{font-size:14.5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"></div>
  <p class="note"><strong>Sample demo built on a public product to show my approach.</strong> It is a click-through made from screenshots of Snyk's free tier, run on an intentionally vulnerable demo app, and is not affiliated with Snyk. The original demos I built for sales enablement at Tracebit are confidential.</p>

const card = document.getElementById('card');
const N = D.steps.length;
let i = -1; // -1 hook, 0..N-1 steps, N cta

function dots(){
  let h='<div class="dots" aria-hidden="true">';
  for(let k=0;k<N;k++) h+=`<span class="dot ${k===i?'on':(k<i?'done':'')}"></span>`;
  return h+'</div>';
}
function render(){
  if(i<0){
    card.innerHTML=`<div class="screen"><div class="eyebrow">Interactive demo</div>
      <h1>202 vulnerabilities. Which ones could actually hurt us?</h1>
      <p>A short walkthrough a security analyst could share with their CISO, to decide whether a proof of concept is worth approving.</p>
      <button class="primary" id="go">Start the demo</button>
      <div class="tip">Use the Back and Next buttons at the top, or click the highlighted areas.</div></div>`;
    document.getElementById('go').onclick=()=>{i=0;render()};
    return;
  }
  if(i>=N){
    card.innerHTML=`<div class="screen"><div class="eyebrow">Next step</div>
      <h1>Approve a 2-week POC on one service.</h1>
      <p>Run it on one real service for two weeks, then decide with real results in front of you.</p>
      <button class="ghost" id="back">Back</button> <button class="primary" id="again">Replay the demo</button></div>`;
    document.getElementById('again').onclick=()=>{i=-1;render()};
    document.getElementById('back').onclick=()=>{i=N-1;render()};
    return;
  }
  const s=D.steps[i], im=D.imgs[s.img];
  const P=s.pop, pos=`left:${P.l}%;width:${P.w}%;${P.t!==undefined?'top:'+P.t+'%':'bottom:'+P.b+'%'}`;
  const pop = `<div class="pop pop-${P.a}" style="${pos}"><div class="pop-step">Step ${i+1} of ${N}</div><h2>${s.title}</h2><p>${s.body}</p><div class="pop-foot"><span class="hint">${s.hint||''}</span><button id="pnext">${i===N-1?'Finish':'Next'} &rarr;</button></div></div>`;
  const hot = s.hot ? `<div class="hot" role="button" tabindex="0" aria-label="${s.hint}" style="left:${s.hot.l}%;top:${s.hot.t}%;width:${s.hot.w}%;height:${s.hot.h}%"></div>` : '';
  card.innerHTML=`<div class="bar"><button class="ghost" id="prev" aria-label="Back">&larr; Back</button><div class="mid"><span class="step-label">Step ${i+1} of ${N}</span>${dots()}</div><button class="primary" id="next">${i===N-1?'Finish':'Next'} &rarr;</button></div>
    <div class="stage"><div class="shot"><img src="${im.src}" width="${im.w}" height="${im.h}" alt="Screenshot for step ${i+1}: ${s.title}">${hot}</div>${pop}</div>`;
  document.getElementById('prev').onclick=()=>{i=i===0?-1:i-1;render()};
  document.getElementById('next').onclick=()=>{i++;render()};
  document.getElementById('pnext').onclick=()=>{i++;render()};
  const h=card.querySelector('.hot');
  if(h){h.onclick=()=>{i++;render()};h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();i++;render()}}}
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&i<N){i++;render()}
  if(e.key==='ArrowLeft'&&i>-1){i--;render()}
});
render();
</script>
